name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Optimize local images (WebP)
        run: npm run optimize:images

      - name: Generate showcase feed
        env:
          YOUTUBE_CHANNEL_ID: UCiGoENRCcmKv6QL-e9FmupA
          SHOWCASE_MAX_ITEMS: "24"
          TIKTOK_GENERATED_JSON_URL: https://raw.githubusercontent.com/chrisrpriceuk/feed/main/tiktok-feed.json
        run: npm run update:showcase-feed

      - name: Build static site
        env:
          NEXT_PUBLIC_N8N_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_N8N_WEBHOOK_URL }}
          NEXT_PUBLIC_SHOWCASE_FEED_URL: ${{ vars.NEXT_PUBLIC_SHOWCASE_FEED_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
