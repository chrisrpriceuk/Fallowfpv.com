name: Update TikTok Feed

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install yt-dlp
        run: python3 -m pip install --upgrade yt-dlp

      - name: Generate TikTok feed data
        env:
          TIKTOK_USERNAME: fallowfpv
          TIKTOK_MAX_ITEMS: "24"
        run: node scripts/update-tiktok-feed.mjs

      - name: Build client showcase feed
        env:
          YOUTUBE_CHANNEL_ID: UCiGoENRCcmKv6QL-e9FmupA
          SHOWCASE_MAX_ITEMS: "24"
          TIKTOK_GENERATED_JSON_URL: https://raw.githubusercontent.com/chrisrpriceuk/feed/main/tiktok-feed.json
        run: node scripts/update-showcase-feed.mjs

      - name: Commit changes
        run: |
          git add data/tiktok-feed.json public/showcase-feed.json public/showcase-thumbs/tiktok
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update showcase feeds"
          git push
